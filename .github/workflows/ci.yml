name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Documented pin consistency
        # FIRST step, ahead of the toolchain install — it reads files and runs
        # no cyrius, so failing here costs the runner nothing but a checkout.
        #
        # VERSION, cyrius.cyml [package].cyrius and cyrius.cyml [deps.darshana]
        # own the three numbers this project pins. Every other spelling of them —
        # README.md, docs/guides/, docs/development/state.md, src/main.cyr's
        # --version literal — is a copy, and nothing else in CI reads prose. The
        # build does not; the suite renders banners; the "Verify version" step in
        # release.yml (:22) ties the git TAG to VERSION and stops at the repo root.
        # So the copies rotted: README.md and docs/guides/getting-started.md
        # quoted `cyrius = "6.0.1"` through the 1.1.0, 1.1.1 and 1.1.2 releases,
        # and roadmap.md still called v1.0.0 the shipped version at 1.1.3.
        #
        # The gate is shape-aware, not number-aware: it matches only the forms a
        # LIVE claim takes and leaves the deliberate history alone — CHANGELOG.md,
        # state.md's dated `**N.N.N** —` paragraphs, benchmarks.md's per-point
        # `**Toolchain**:` stamps, issues/archive/. It also asserts its own
        # coverage, so a doc reworded out from under a pattern goes RED instead of
        # quietly checking one thing fewer. Details in the script header.
        #
        # release.yml calls this workflow as its CI Gate, so a tag push is gated
        # by it too.
        run: sh scripts/doc-pin-check.sh

      - name: Install Cyrius toolchain
        # Pulls the version pinned in cyrius.cyml [package].cyrius and runs
        # the install.sh that ships inside the release tarball. The bundled
        # installer builds the VERSIONED layout (~/.cyrius/versions/<ver>/)
        # and repoints the version-agnostic bin/lib symlinks at it.
        #
        # Do NOT hand-roll a flat ~/.cyrius/{bin,lib} copy. That worked
        # before 6.5.25 only by accident: `_dep_find_stdlib_dir()` branch (a)
        # tested `file_exists("src/main.cyr")`, which is true for essentially
        # every cyrius project, so bannermanor's OWN vendored ./lib was
        # returned as "the stdlib" and the pinned-snapshot branch never ran.
        # 6.5.25 replaced that probe with `_dep_is_cyrius_source_repo()`, so a
        # manifest with [package].cyrius set now REQUIRES
        # ~/.cyrius/versions/<pin>/lib and hard-errors otherwise:
        #   error: cyrius.cyml pins version X but it is not installed at ...
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep 'cyrius *= *"' cyrius.cyml 2>/dev/null | head -1 | sed 's/.*"\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_VERSION="$CYRIUS_VERSION" sh "cyrius-$CYRIUS_VERSION-x86_64-linux/install.sh"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve dependencies
        # --locked: lib/ and cyrius.lock must be exactly what the manifest's
        # pins resolve to. A hand-edited lib/ file (CLAUDE.md forbids it) or
        # a lock that drifted from the tags fails here, not three steps on.
        run: cyrius deps --locked

      - name: Lint
        # --strict exits nonzero on any warning; --strict-deferrals on any
        # untracked TODO/FIXME. All of src/ plus the three harnesses. cyrlint
        # refuses a file that does not compile, so this is not vacuous on a
        # broken file. Note it is a style gate only: it does not see raw
        # syscall numbers, which is why the readers' AGNOS bug shipped
        # through a clean lint (1.1.4).
        run: cyrius lint --strict --strict-deferrals src/*.cyr tests/bannermanor.tcyr tests/bannermanor.bcyr tests/bannermanor.fcyr

      - name: Build
        # Binary is `bnrmr` (vowel-dropped per the commandress→cmdrs
        # pattern), set via [build].output in cyrius.cyml. We pass it
        # explicitly here because the repo name ("bannermanor") differs
        # from the binary name.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/bnrmr

      - name: Cross-build (AGNOS, aarch64)
        # The pinned toolchain cross-compiles both targets in-process from
        # this x86_64 runner. This step gates COMPILE breakage only. The
        # aarch64 binary runs under qemu-user below ("aarch64 at runtime").
        # The AGNOS binary cannot run on Linux at all; scripts/agnos-smoke.py
        # boots it on a real agnos kernel in QEMU, by hand (it needs the
        # agnos tree's kernel and rootfs).
        run: |
          cyrius build --agnos src/main.cyr build/bnrmr-agnos
          cyrius build --aarch64 src/main.cyr build/bnrmr-aarch64

      - name: Smoke
        # The built binary runs, renders, and reports the version VERSION
        # says (doc-pin-check reads the literal in the source; this reads
        # what the binary actually prints).
        run: |
          want="bnrmr $(tr -d '[:space:]' < VERSION)"
          got="$(./build/bnrmr --version)"
          test "$got" = "$want" || { echo "--version printed '$got', VERSION says '$want'"; exit 1; }
          out="$(./build/bnrmr AGNOS)"
          test -n "$out" || { echo "bnrmr AGNOS printed nothing"; exit 1; }
          ./build/bnrmr --list-fonts > /dev/null

      - name: Test
        # Explicit .tcyr path (matches patra + mihi/iam/chakshu) — the
        # version-stable form. It sidesteps the auto-discovery surface, which
        # has changed shape more than once: bare `cyrius test` now walks
        # tests/ recursively (`_tests_walk`, cbt/commands.cyr), skipping
        # symlinked dirs. Naming the file keeps CI pinned to exactly what we
        # mean to run. Add new .tcyr files here as they land.
        #
        # (An earlier version of this comment claimed the `cyrius tests`
        # discovery subcommand postdates the pin. That was wrong — `cmd_tests`
        # ships in both 6.2.24 and 6.5.35. The explicit path is a deliberate
        # choice, not a workaround.)
        #
        # Each .tcyr runs under a 300 s deadline; override with
        # CYRIUS_TEST_TIMEOUT=<seconds> (0 disables). The deadline is also
        # what turns a regressed FIFO gate (t_reader_fifo blocks in open)
        # into a failure instead of a hung job.
        run: cyrius test tests/bannermanor.tcyr

      - name: Golden suite
        # The v1.0 frozen-output contract, byte for byte: every invocation in
        # tests/golden/cases.sh (339 at 1.7.0) in three tiers (frozen
        # renders, error paths, snapshot help/version/listing), 113 of them
        # on a pty through script(1), which ubuntu-latest ships in
        # util-linux. A missing script(1) FAILS the suite; it never skips
        # the pty leg. See scripts/golden.sh.
        run: sh scripts/golden.sh

      - name: aarch64 at runtime (qemu-user)
        # Runs what the cross-build step only compiled (since 1.7.0; before
        # that both passed locally but nothing gated them). `cyrius test
        # --aarch64` cross-compiles the suite and runs it through
        # /usr/bin/qemu-aarch64, which the qemu-user package installs; the
        # golden matrix runs the cross-built bnrmr through the same
        # emulator, pty leg included, against the same records as x86_64.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          cyrius test --aarch64 tests/bannermanor.tcyr
          BNRMR=build/bnrmr-aarch64 BNRMR_RUNNER=qemu-aarch64 sh scripts/golden.sh

      - name: Fuzz
        # A regression gate over the three font parsers (issue 0010): seeded
        # mutants of every fixture, scrub / geometry / charmap invariants on
        # whatever loads, and a guard page after each input so an over-read
        # faults. The harness also checks its own oracle can say no. Until
        # 1.4.1 this target was a stub that always passed; see
        # tests/bannermanor.fcyr before citing it as evidence of anything.
        run: cyrius fuzz tests/bannermanor.fcyr

      - name: Install smoke
        # Issue 0015: an installed bnrmr must find its fonts from any
        # directory. Installs into a scratch prefix with the same script the
        # release tarball uses, then runs from / (no ./fonts there), so only
        # the install directory beside the executable can supply slim.
        run: |
          P="$RUNNER_TEMP/prefix"
          sh scripts/install.sh "$P"
          cd /
          "$P/bin/bnrmr" --font slim HI > /dev/null
          "$P/bin/bnrmr" --font block HI > /dev/null
          "$P/bin/bnrmr" --list-fonts | grep -q '^  slim '
          test -f "$P/share/man/man1/bnrmr.1"

      - name: Man page
        # man/bnrmr.1 must format without a single groff warning (-ww). The
        # suite separately checks it names every flag (t_man_page).
        run: |
          command -v groff > /dev/null || sudo apt-get install -y groff-base
          groff -man -Tutf8 -ww -z man/bnrmr.1 2> "$RUNNER_TEMP/groff.log"
          if [ -s "$RUNNER_TEMP/groff.log" ]; then cat "$RUNNER_TEMP/groff.log"; exit 1; fi

      - name: Coverage floor
        # Reference coverage: the share of src/'s public functions the test
        # corpus names. A floor, not a correctness proof. 100% since 1.4.1
        # (36/36), when src/cli.cyr made the CLI testable; a new public
        # function without a test drops it below and fails here.
        run: cyrius coverage --min 100
